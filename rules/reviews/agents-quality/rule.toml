id = "agents-quality"
name = "AGENTS.md quality"
description = "Evaluate actionable coding-agent guidance in AGENTS.md against a governance rubric"
blocking = false

[review]
provider = "gemini-flash-lite"
prompt = "prompt.md"
include_diff = false

[review.parameters]
model = "gemini-3.5-flash-lite"

[[review.context]]
path = "AGENTS.md"

[review.trigger]
changed_files = ["AGENTS.md"]
