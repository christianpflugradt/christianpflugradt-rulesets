id = "agents-quality"
name = "AGENTS.md quality"
description = "AGENTS.md gives coding agents clear, actionable guidance"
blocking = false

[review]
provider = "gemini-flash"
prompt = "prompt.md"
include_diff = false

[review.parameters]
models = "gemini-3.8-flash,gemini-3.6-flash"

[[review.context]]
path = "AGENTS.md"

[review.trigger]
changed_files = ["AGENTS.md"]
