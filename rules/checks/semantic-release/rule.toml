id = "semantic-release"
name = "Semantic Release"
description = "Releases use the shared Semantic Release configuration"
enabled = true
blocking = true

[check]
command = "python3 @rule/check.py @context @param/tag_format"
timeout_seconds = 60

[parameters.tag_format]
type = "string"
required = true
description = "Release tag format, normally v${version}; repositories with legacy tags may declare ${version}"
