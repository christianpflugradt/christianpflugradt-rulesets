id = "commit-message"
name = "Commit message format"
description = "Commit headers follow Conventional Commits and use an allowed scope"
enabled = true
blocking = true

[parameters.scopes_file]
type = "file"
required = true
description = "Repository-specific list of allowed commit scopes"

[check]
command = "python3 @rule/check.py @context @param/scopes_file"
