id = "release-contract"
description = "Verify CI readiness, record candidates and verify complete release evidence"

[check]
command = "python3 @rule/check.py @context @param/ci_policy @param/artifacts_policy"
timeout_seconds = 180

[parameters.ci_policy]
type = "file"
required = true

[parameters.artifacts_policy]
type = "file"
required = true
