id = "agents-size"
description = "Limit AGENTS.md to a token budget approximated by words and punctuation marks"
enabled = true
blocking = true

[check]
command = "python3 @rule/check.py @context @param/max_tokens"
timeout_seconds = 30

[parameters.max_tokens]
type = "string"
required = true
description = "Positive integer limit of words and punctuation marks in AGENTS.md"
