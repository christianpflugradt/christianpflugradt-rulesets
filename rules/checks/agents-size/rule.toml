id = "agents-size"
name = "AGENTS.md size"
description = "AGENTS.md stays within its size limit"
enabled = true
blocking = true

[check]
command = "python3 @rule/check.py @context @param/max_tokens"
timeout_seconds = 30

[parameters.max_tokens]
type = "string"
required = true
description = "Maximum size of AGENTS.md as a positive integer, counted in words and punctuation marks"
