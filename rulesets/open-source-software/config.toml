id = "open-source-software"
description = "Require an approved license and aligned quality assurance for open-source software"
run_at = ["pre-push", "check"]
rules = [
  "rules/checks/license",
  "rules/checks/workflow-syntax",
  "rules/checks/ci-workflow",
  "rules/checks/shell-scripts",
  "rules/checks/mise-prepare",
  { id = "rules/checks/npm-audit", run_at = ["check"] },
]
